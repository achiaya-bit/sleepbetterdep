name: CI - SleepBetter

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend - Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build backend
        working-directory: backend
        run: ./mvnw clean package -DskipTests

  frontend:
    name: Frontend - Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install frontend deps
        working-directory: frontend/vite-project
        run: npm install

      - name: Build frontend
        working-directory: frontend/vite-project
        run: npm run build

  docker:
    name: Docker Compose - Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker build
        run: docker-compose build
